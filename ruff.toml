# Formatting and linting: `ruff format` and `ruff check` (CI checks both).
line-length = 120
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]   # ruff's defaults: syntax errors, undefined names, unused imports/variables
# deliberate in this code: maths-style single-letter names (O, l), small
# lambdas bound to names in tools, an import after a sys.path tweak in cli.py
ignore = ["E741", "E731", "E402"]
