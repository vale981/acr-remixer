# Synthetic tests only: no game files exist on the runner, and the "game"
# tests (which read a local Assetto Corsa Rally install) are excluded.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      # bash, not the Windows default PowerShell: PowerShell only reports the
      # exit code of the last command, so an earlier failing check passed
      - name: Formatting and lint (ruff)
        shell: bash
        run: |
          python -m ruff format --check stagegen tests tools packaging
          python -m ruff check stagegen tests tools packaging

      - name: Python tests (synthetic)
        run: python -m pytest tests -m "not game" -q

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui

      - name: Rust formatting
        shell: bash
        run: |
          cargo fmt --manifest-path gui/Cargo.toml --check
          cargo fmt --manifest-path oodle_shim/Cargo.toml --check

      - name: GUI tests
        run: cargo test --manifest-path gui/Cargo.toml
