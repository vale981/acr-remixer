[package]
name = "oodle_shim"
version = "0.1.0"
edition = "2021"
description = "OodleLZ_Decompress-compatible DLL backed by the open-source oozextract decompressor"
license = "GPL-3.0-or-later"

[lib]
name = "oo2core_shim"
crate-type = ["cdylib"]

[dependencies]
oozextract = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
