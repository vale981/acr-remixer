[package]
name = "acr-remixer-gui"
version = "0.2.1"
edition = "2021"
description = "ACR Remixer: new rally stages remixed from Assetto Corsa Rally's own (GUI)"
license = "GPL-3.0-or-later"

[[bin]]
name = "acr-remixer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_plot = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
